# 앱 제품의 정적 검사와 빌드: 프런트엔드(타입·린트·빌드)와 Rust(서식·컴파일·clippy).
#
# 보안 검사(security-scan.yml)와 독립적으로 실행한다. rhwp(external/rhwp, 수 GB)는 WebView의 WASM으로 실행할 때 불러오므로
# (T007, scripts/build-rhwp-wasm.sh) 받지 않는다. WordCraft(external/wordcraft)는 Rust 백엔드가 path 의존성으로 링크하므로(T008)
# Rust 작업만 그 submodule 하나를 고정 커밋으로 얕게 받는다. 프런트엔드 작업은 submodule이 필요 없다.
# 산출물 업로드·배포·원격 쓰기는 하지 않는다.

name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: 프런트엔드 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃 (submodule 제외)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 의존성 설치 (package-lock.json 기준)
        run: npm ci --no-fund --no-audit

      - name: TypeScript 타입 검사
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: 프런트엔드 빌드
        run: npm run build

  rust:
    name: Rust 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_TOOLCHAIN: 1.99.0
      CARGO_TERM_COLOR: never
      # Privilege is used only for namespace/mount setup. Cargo runs as the
      # runner UID with no capabilities; no user-namespace mapping is needed.
      GEUL_SANDBOX: sudo-bwrap
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: 저장소 체크아웃 (submodule 제외)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Tauri Linux 의존성 설치 (WebKitGTK 4.1, bubblewrap)
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap libwebkit2gtk-4.1-dev pkg-config

      # T008: WordCraft 엔진을 링크한다. 부모 저장소 gitlink가 가리키는 고정 커밋만 받는다(rhwp는 받지 않음).
      - name: WordCraft submodule (고정 커밋, 얕게)
        working-directory: .
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 external/wordcraft
          git submodule status external/wordcraft

      - name: Rust 도구 체인 설치 (버전 고정)
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Cargo 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      # Wrapper가 Cargo cache를 준비할 때만 registry/git 캐시를 쓰기 가능하게 둡니다.
      - name: 잠금 파일 의존성 캐시 준비
        run: python3 ../scripts/cargo-geul.py fetch

      - name: cargo fmt
        run: python3 ../scripts/cargo-geul.py fmt --check

      - name: cargo check
        run: python3 ../scripts/cargo-geul.py check --lib --bins

      - name: cargo clippy
        run: python3 ../scripts/cargo-geul.py clippy --lib --bins -- -D warnings
