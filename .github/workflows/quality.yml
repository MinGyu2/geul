# 앱 셸(T004) 품질 검사: 프런트엔드(타입·린트·테스트·빌드)와 Rust(서식·컴파일·clippy).
#
# 보안 검사(security-scan.yml)와 독립적으로 실행한다. rhwp(external/rhwp, 수 GB)는 WebView의 WASM으로 실행할 때 불러오므로
# (T007, scripts/build-rhwp-wasm.sh) 받지 않는다. WordCraft(external/wordcraft)는 Rust 백엔드가 path 의존성으로 링크하므로(T008)
# Rust 작업만 그 submodule 하나를 고정 커밋으로 얕게 받는다. 프런트엔드 작업은 submodule이 필요 없다.
# 산출물 업로드·배포·원격 쓰기는 하지 않는다.

name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: 프런트엔드 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃 (submodule 제외)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Node.js 설정
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 의존성 설치 (package-lock.json 기준)
        run: npm ci --no-fund --no-audit

      - name: TypeScript 타입 검사
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: 프런트엔드 빌드
        run: npm run build

  rust:
    name: Rust 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_TOOLCHAIN: 1.99.0
      CARGO_TERM_COLOR: never
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: 저장소 체크아웃 (submodule 제외)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Tauri Linux 의존성 설치 (WebKitGTK 4.1)
        working-directory: .
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev pkg-config

      # T008: WordCraft 엔진을 링크한다. 부모 저장소 gitlink가 가리키는 고정 커밋만 받는다(rhwp는 받지 않음).
      - name: WordCraft submodule (고정 커밋, 얕게)
        working-directory: .
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 external/wordcraft
          git submodule status external/wordcraft

      - name: Rust 도구 체인 설치 (버전 고정)
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup override set "$RUST_TOOLCHAIN"
          rustc --version
          cargo --version

      - name: Cargo 캐시
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo check
        run: cargo check --locked --all-targets

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test (문서 형식 판별·세션 T006, WordCraft 어댑터 T008)
        run: cargo test --locked

  d4-analyzer:
    name: D4 증거 분석기 무결성 검사
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 저장소 체크아웃 (submodule 제외)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      # 표준 라이브러리와 합성 fixture만 사용. 비공개 raw가 없으면 역사 재분석 테스트만 skip.
      - name: Python 분석기 및 runner 회귀 검사
        run: python3 -m unittest discover -s tests/integration/rhwp/evidence/t010-d4-critical-path-remediation -p 'test_*.py'

      - name: 최적화 모드에서도 무결성 검사 유지
        run: python3 -O -m unittest discover -s tests/integration/rhwp/evidence/t010-d4-critical-path-remediation -p test_analysis.py

      - name: 환경변수 최적화에서도 무결성 검사 유지
        run: PYTHONOPTIMIZE=1 python3 -m unittest discover -s tests/integration/rhwp/evidence/t010-d4-critical-path-remediation -p test_analysis.py

      # 가짜 브라우저 프로세스·로컬 HTTP 서버·합성 fixture만 사용(실제 브라우저·submodule·native 바이너리 없음).
      - name: engine-phases runner 실패 경로·checksum catalog·native attribution 회귀 검사
        run: python3 -I -m unittest discover -s tests/integration/rhwp/engine-phases -p 'test_*.py'

      - name: engine-phases 회귀 검사 (최적화 모드)
        run: python3 -I -O -m unittest discover -s tests/integration/rhwp/engine-phases -p 'test_*.py'
