# Gitleaks 설정 (검증 버전: gitleaks 8.30.1)
#
# 기본 규칙 전체를 그대로 사용한다. 사용자 홈 절대 경로·내부 주소·개인정보는
# scripts/check-sensitive-info.py가 담당하므로 여기서 중복 정의하지 않는다.
#
# 오탐 예외는 검토 후에만 추가한다. 예외를 추가할 때는 [[allowlists]] 항목에
# description(사유)과 가능한 한 좁은 paths/regexes를 함께 적고, 규칙 자체를 끄지 않는다.
# 절차: docs/development/security-policy.md

title = "geul gitleaks config"

[extend]
useDefault = true

# T010 evidence records the verified SHA-256 of isolated src/wasm_api.rs.
# The filename's api token causes generic-api-key to misclassify this public source checksum.
[[allowlists]]
description = "T010 verified wasm_api.rs source checksum, evidence JSON only"
condition = "AND"
paths = ['''^tests/integration/rhwp/evidence/t010-cache-concurrency/(engine-identity|fresh-chrome|fresh-webkit|repro-chrome|notify-chrome|notify-webkit|v2-chrome|v2-webkit)\.json$''']
regexTarget = "secret"
regexes = ['''^941a33bd400941f2d3f590f6194e5f476044042fa6e7cdcf08ff4f1d5f295ec2$''']
