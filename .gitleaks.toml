# Gitleaks 설정 (검증 버전: gitleaks 8.30.1)
#
# 기본 규칙 전체를 그대로 사용한다. 사용자 홈 절대 경로·내부 주소·개인정보는
# scripts/check-sensitive-info.py가 담당하므로 여기서 중복 정의하지 않는다.
#
# 오탐 예외는 검토 후에만 추가한다. 예외를 추가할 때는 [[allowlists]] 항목에
# description(사유)과 가능한 한 좁은 paths/regexes를 함께 적고, 규칙 자체를 끄지 않는다.
# 절차: docs/development/security-policy.md

title = "geul gitleaks config"

[extend]
useDefault = true

# T010 evidence records the verified SHA-256 of isolated src/wasm_api.rs.
# The filename's api token causes generic-api-key to misclassify this public source checksum.
[[allowlists]]
description = "T010 verified wasm_api.rs source checksum, evidence JSON only"
condition = "AND"
paths = ['''^tests/integration/rhwp/evidence/t010-cache-concurrency/(engine-identity|fresh-chrome|fresh-webkit|repro-chrome|notify-chrome|notify-webkit|v2-chrome|v2-webkit)\.json$''']
regexTarget = "secret"
regexes = ['''^941a33bd400941f2d3f590f6194e5f476044042fa6e7cdcf08ff4f1d5f295ec2$''']

# T010 render-ownership evidence: independently verified public source digests.
# Keep the default credential rules; exception requires both exact evidence path and digest.
[[allowlists]]
description = "T010 isolated renderer public wasm_api.rs checksums; source/patch reconstruction verified"
condition = "AND"
paths = ['''^tests/integration/rhwp/evidence/t010-render-ownership/(engine|patch|fresh-apply|full-page-engine|full-page-chrome|full-page-webkit|full-page-fresh-apply|final-wasm-checks|url-reservation-stale-build|pre-publication-engine|historical-chrome|historical-webkit|pre-publication-fix-chrome|pre-publication-fix-webkit|getter-blocked-chrome|getter-detail-chrome|getter-diagnostic-chrome|getter-diagnostic-webkit|chrome|webkit)\.json$''']
regexTarget = "secret"
regexes = ['''^941a33bd400941f2d3f590f6194e5f476044042fa6e7cdcf08ff4f1d5f295ec2$''','''^de0a59a3c774cc842e9e7af9874cc99fc5aa578d50dac1995f4d166537f04167$''','''^dba5751a411cad724e69fe7bcacd207c92fbc3d0ff0502b2582023fa81f2322a$''','''^ab73fb12f34b08cd621362c6f6d0f44340b0007bf89baeaba3b97bcd92c5afcf$''']

# Resource-scheduler evidence reuses the unchanged public wasm_api source.
[[allowlists]]
description = "T010 resource scheduler verified public wasm_api.rs checksum"
condition = "AND"
paths = ['''^tests/integration/rhwp/evidence/t010-resource-scheduler/(before-chrome|attempt-1-(chrome|webkit|engine|patch|final-wasm-checks)|diagnostic-harness-(chrome|webkit)|pre-shared-(chrome|webkit)|chrome|webkit|engine|patch|final-wasm-checks)\.json$''']
regexTarget = "secret"
regexes = ['''^ab73fb12f34b08cd621362c6f6d0f44340b0007bf89baeaba3b97bcd92c5afcf$''']
# Lease-progress evidence contains independently reconstructed public source digests.
# Limit both the exact JSON filenames and the exact public SHA-256 values.
[[allowlists]]
description = "T010 lease progress verified public wasm_api.rs source checksums"
condition = "AND"
paths = ['''^tests/integration/rhwp/evidence/t010-lease-progress/(attempt-1-candidate-d3-service-save|attempt-1-chrome|attempt-1-engine|attempt-1-final-wasm-checks|attempt-1-notification-chrome|attempt-1-patch|attempt-1-webkit|before-chrome|before-webkit|byte-before-chrome|byte-before-webkit|byte-single-owner-before-chrome|candidate-d3-service-save|chrome|diagnostic-baseline-resident-assertion|diagnostic-byte-fixture-type|diagnostic-fmt-generated-inputs|diagnostic-fmt-generated-order|diagnostic-harness-count|engine|final-wasm-checks|fresh-apply|patch|pre-byte-before-chrome|pre-byte-before-webkit|pre-byte-candidate-d3-service-save|pre-byte-chrome|pre-byte-engine|pre-byte-final-wasm-checks|pre-byte-fresh-apply|pre-byte-patch|pre-byte-webkit|pre-native-fixture-before-chrome|pre-native-fixture-before-webkit|pre-native-fixture-chrome|pre-native-fixture-webkit|security-false-positive-review|webkit)\.json$''']
regexTarget = "secret"
regexes = ['''^40f8a2faf5e279127b391fc9d4222ce48770cbd30bcea77cd51511d8082e8d7f$''','''^ab73fb12f34b08cd621362c6f6d0f44340b0007bf89baeaba3b97bcd92c5afcf$''','''^ae555376191bc965b5c4c192c990008c6aef8d0459455678c9953f86dc83fcfc$''']

[[allowlists]]
description = "T010 initial integrity hashes of two pre-existing public API evidence files"
condition = "AND"
paths = ['''^tests/integration/rhwp/evidence/t010-lease-progress/initial-integrity\.json$''']
regexTarget = "secret"
regexes = ['''^6c35cd4ff761272ec034bf09d1fde054ee79ad483aa785c984e243d465e094b4$''','''^a49f8417b3beace7a3d415c64e5536b5e7c336642469b6e524f322caf1571646$''']
