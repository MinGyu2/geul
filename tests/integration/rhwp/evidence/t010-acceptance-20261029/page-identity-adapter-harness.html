<!doctype html>
<meta charset="utf-8">
<title>T010 experimental page reuse diagnostic</title>
<style>
  body { margin: 0; background: #d8d8d8; font: 12px sans-serif; }
  #out { position: fixed; inset: 0 0 auto; z-index: 10; max-height: 8rem; overflow: auto; background: white; }
  #pages { padding-top: 8rem; }
  .t010-page { display: block; width: max-content; margin: 8px auto; background: white; }
</style>
<pre id="out">RUNNING</pre>
<main id="pages"></main>
<script type="module">
import { createOwnershipSession } from '/tests/integration/rhwp/ownership-poc/session.mjs';
import { createLifecycleTrace } from '/tests/integration/rhwp/ownership-poc/lifecycle-trace.mjs';
import { svg } from '/tests/integration/rhwp/cache-concurrency/fixtures.mjs';

const out = document.querySelector('#out');
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const percentile = values => {
  const sorted = [...values].sort((a, b) => a - b);
  if (!sorted.length) return { n: 0, p50: null, p95: null, max: null };
  return { n: sorted.length, p50: sorted[Math.floor((sorted.length - 1) * 0.5)], p95: sorted[Math.floor((sorted.length - 1) * 0.95)], max: sorted.at(-1) };
};
const sha256 = async bytes => [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map(n => n.toString(16).padStart(2, '0')).join('');
const result = {
  status: 'RUNNING', official: false,
  scope: 'experimental T010 adapter; chemical HWP; actual completed WASM RenderJob identity; same-session Full exact RGBA comparisons; not production approval or D4',
  browser: { userAgent: navigator.userAgent, platform: navigator.platform, dpr: devicePixelRatio },
  candidate: null, fixtureSha256: null, pageCount: 0, revisions: [],
};
let adapterSession = null, documentModel = null, engine = null, originalSnapshot = null, editedSnapshot = null, delayedImageRestore = null;
const trace = createLifecycleTrace(20000);
window.__d4LifecycleTrace = trace;
window.__GEUL_T010_PAGE_IDENTITY_POC__ = true;

class HarnessSession {
  constructor(_id, _backend, _registry, loader) {
    this.loader = loader;
    this.modelVersion = 1;
    this.status = { kind: 'ready' };
    this.firstPaintMs = null;
    this.loadStartedAt = performance.now();
    this._pages = [];
    this.listeners = new Set();
  }
  prepareRendering() { return true; }
  paintedSummary() { return null; }
  get pages() { return this._pages; }
  subscribe(listener) { this.listeners.add(listener); return () => this.listeners.delete(listener); }
  releaseRendering() {}
  dispose() { this.doc?.free(); }
}

function readPageSizes(doc) {
  return Array.from({ length: doc.pageCount() }, (_, page) => {
    const info = JSON.parse(doc.getPageInfo(page));
    return { width: info.width, height: info.height };
  });
}

async function waitForJobs(label, completedBefore, expected, timeoutMs = 120000) {
  const deadline = performance.now() + timeoutMs;
  while (performance.now() < deadline) {
    const active = window.__geulOwnership.stats().sessions.find(s => s.sessionId === 1);
    const done = window.__geulOwnership.counters.completed - completedBefore;
    if (done >= expected && active?.active === 0 && active?.queued === 0) return;
    if (window.__geulOwnership.counters.errors > 0 || window.__geulOwnership.counters.limits > 0) {
      throw new Error(`${label}: adapter errors/limits ${JSON.stringify(window.__geulOwnership.counters)}`);
    }
    await sleep(20);
  }
  throw new Error(`${label}: timeout ${JSON.stringify({ counters: window.__geulOwnership.counters, session: window.__geulOwnership.stats().sessions })}`);
}

function frameDifference(page, actual, reference, scale) {
  const start = performance.now();
  documentModel.renderPageToCanvas(page, reference, scale);
  const referenceRenderMs = performance.now() - start;
  if (actual.width !== reference.width || actual.height !== reference.height) {
    return { page, exact: false, extentMismatch: true, actual: [actual.width, actual.height], reference: [reference.width, reference.height], referenceRenderMs };
  }
  const a = actual.getContext('2d').getImageData(0, 0, actual.width, actual.height).data;
  const b = reference.getContext('2d').getImageData(0, 0, reference.width, reference.height).data;
  let channelDifferences = 0, pixelDifferences = 0;
  for (let i = 0; i < a.length; i += 4) {
    let different = false;
    for (let k = 0; k < 4; k++) if (a[i + k] !== b[i + k]) { channelDifferences++; different = true; }
    if (different) pixelDifferences++;
  }
  return { page, exact: channelDifferences === 0, width: actual.width, height: actual.height, channelDifferences, pixelDifferences, referenceRenderMs };
}

async function renderRevision(label, scale = 0.5, expectedReusedPages = []) {
  const completedBefore = window.__geulOwnership.counters.completed;
  const jobsBefore = window.__geulOwnership.counters.fullJobs;
  const skippedBefore = window.__geulOwnership.counters.identityJobsSkipped;
  const identityTimeBefore = window.__geulOwnership.counters.identityComputeMs;
  // true는 현재 프레임 완료를 뜻한다. 동기 Full 완료도 true일 수 있다.
  // 재사용 기대값은 편집 전후 엔진 identity로 정하고 실제 skip 계수와 따로 대조한다.
  const reusedPages = [];
  const calls = canvases.map((canvas, page) => {
    const before = window.__geulOwnership.counters.identityJobsSkipped;
    const completed = adapterSession.renderPage(page, canvas, scale);
    const delta = window.__geulOwnership.counters.identityJobsSkipped - before;
    if (delta !== 0 && delta !== 1) throw new Error(`${label}: invalid per-request skip accounting`);
    if (delta === 1) reusedPages.push(page);
    return completed;
  });
  const expectedJobs = canvases.length - expectedReusedPages.length;
  await waitForJobs(label, completedBefore, expectedJobs);
  const jobs = window.__geulOwnership.counters.fullJobs - jobsBefore;
  const skipped = window.__geulOwnership.counters.identityJobsSkipped - skippedBefore;
  if (jobs !== expectedJobs || skipped !== canvases.length - expectedJobs) throw new Error(`${label}: expected job/reuse accounting differs ${JSON.stringify({ jobs, skipped, expectedJobs, calls })}`);
  if (JSON.stringify(reusedPages) !== JSON.stringify(expectedReusedPages)) throw new Error(`${label}: reused pages differ from independent identities`);
  const visiblePages = reusedPages.filter(page => {
    const r = canvases[page].getBoundingClientRect();
    return r.bottom > 0 && r.top < innerHeight;
  });
  const offscreenPages = reusedPages.filter(page => !visiblePages.includes(page));
  const reference = document.createElement('canvas');
  const pixels = canvases.map((canvas, page) => frameDifference(page, canvas, reference, scale));
  reference.width = reference.height = 0;
  const computeMs = window.__geulOwnership.counters.identityComputeMs - identityTimeBefore;
  const record = {
    label, scale, fullJobsStarted: jobs, completed: expectedJobs, synchronouslyCompletedPages: calls.flatMap((done, page) => done ? [page] : []),
    identityJobsSkipped: skipped, reusedPages, visibleReusedPages: visiblePages, offscreenReusedPages: offscreenPages,
    identityPreflightMs: computeMs, identityPreflightP95Ms: percentile([computeMs]).p95,
    fullReferenceRenderMs: percentile(pixels.map(p => p.referenceRenderMs)),
    exactRGBA: { pages: pixels.length, exactPages: pixels.filter(p => p.exact).length, mismatches: pixels.filter(p => !p.exact) },
  };
  result.revisions.push(record);
  if (pixels.some(p => !p.exact)) throw new Error(`${label}: independent Full exact RGBA mismatch`);
  return { record, pixels };
}

async function run() {
  const manifest = await (await fetch('/__ownership_candidate__/ENGINE.json', { cache: 'no-store' })).json();
  result.candidate = { wasmSha256: manifest.artifacts['rhwp_bg.wasm'], sourceTreeSha256: manifest.sourceTreeSha256, experimental: manifest.experimental, productionApproval: manifest.productionApproval };
  if (!manifest.experimental || manifest.productionApproval !== 'NOT_APPROVED') throw new Error('candidate must remain explicitly experimental');
  const fixture = await (await fetch('/complex-hwp.hwp', { cache: 'no-store' })).arrayBuffer();
  result.fixtureSha256 = await sha256(fixture);
  adapterSession = createOwnershipSession(HarnessSession, 1, null, null);
  const loader = await adapterSession.loader();
  documentModel = loader.openDocument(new Uint8Array(fixture));
  adapterSession.doc = documentModel;
  adapterSession._pages = readPageSizes(documentModel);
  engine = window.__geulOwnership.probeEngine();
  result.pageCount = documentModel.pageCount();
  if (result.pageCount !== 24) throw new Error(`chemical fixture page count changed: ${result.pageCount}`);

  canvases = adapterSession._pages.map((_, page) => {
    const wrapper = document.createElement('section'); wrapper.className = 't010-page'; wrapper.dataset.page = String(page);
    const canvas = document.createElement('canvas'); canvas.dataset.page = String(page); wrapper.append(canvas); document.querySelector('#pages').append(wrapper);
    return canvas;
  });
  const identityBefore = adapterSession._pages.map((_, page) => documentModel.geulExperimentalImagePageIdentity(page) ?? null);
  result.identityAvailabilityBeforeEdit = identityBefore.flatMap((id, page) => id ? [page] : []);
  const initial = await renderRevision('initial-full');
  if (initial.record.fullJobsStarted !== result.pageCount || !result.identityAvailabilityBeforeEdit.length) throw new Error('initial Full frames or supported image identities missing');
  if (window.__geulOwnership.counters.identityFramesSupported < result.identityAvailabilityBeforeEdit.length) throw new Error('actual completed RenderJob identity missing');

  const beforeLength = documentModel.getParagraphLength(0, 3);
  originalSnapshot = documentModel.saveSnapshot();
  const edit = JSON.parse(documentModel.insertText(0, 3, 0, 'a'));
  const afterLength = documentModel.getParagraphLength(0, 3);
  if (afterLength !== beforeLength + 1 || edit.charOffset !== 1) throw new Error('deterministic edit was not confirmed');
  editedSnapshot = documentModel.saveSnapshot();
  adapterSession.modelVersion++;
  adapterSession._pages = readPageSizes(documentModel);
  const identityAfter = adapterSession._pages.map((_, page) => documentModel.geulExperimentalImagePageIdentity(page) ?? null);
  result.edit = { paragraph: 3, offset: 0, text: 'a', lengthDelta: afterLength - beforeLength, charOffset: edit.charOffset,
    supportedBefore: identityBefore.filter(Boolean).length, supportedAfter: identityAfter.filter(Boolean).length,
    unchangedSupportedPages: identityBefore.flatMap((id, page) => id && id === identityAfter[page] ? [page] : []),
    changedOrUnsupportedPages: identityBefore.flatMap((id, page) => !id || !identityAfter[page] || id !== identityAfter[page] ? [page] : []),
  };
  const edited = await renderRevision('edited-revision', 0.5, result.edit.unchangedSupportedPages);
  if (!edited.record.identityJobsSkipped || !edited.record.visibleReusedPages.length || !edited.record.offscreenReusedPages.length) {
    throw new Error('reuse did not cover both visible and offscreen supported pages');
  }

  const editUndoSnapshot = documentModel.restoreSnapshot(originalSnapshot);
  if (typeof editUndoSnapshot !== 'string') throw new Error('undo snapshot restore failed');
  adapterSession.modelVersion++;
  adapterSession._pages = readPageSizes(documentModel);
  const identityAfterUndo = adapterSession._pages.map((_, page) => documentModel.geulExperimentalImagePageIdentity(page) ?? null);
  result.undoIdentityComparison = { supported: identityAfterUndo.filter(Boolean).length,
    matchingCurrentFrames: identityAfterUndo.flatMap((id, page) => id && id === identityAfter[page] ? [page] : []) };
  const undo = await renderRevision('undo-restored-revision', 0.5, result.undoIdentityComparison.matchingCurrentFrames);
  const editRedoSnapshot = documentModel.restoreSnapshot(editedSnapshot);
  if (typeof editRedoSnapshot !== 'string') throw new Error('redo snapshot restore failed');
  adapterSession.modelVersion++;
  adapterSession._pages = readPageSizes(documentModel);
  const identityAfterRedo = adapterSession._pages.map((_, page) => documentModel.geulExperimentalImagePageIdentity(page) ?? null);
  result.redoIdentityComparison = { supported: identityAfterRedo.filter(Boolean).length,
    matchingCurrentFrames: identityAfterRedo.flatMap((id, page) => id && id === identityAfter[page] ? [page] : []) };
  const redo = await renderRevision('redo-restored-revision', 0.5, result.redoIdentityComparison.matchingCurrentFrames);

  // Cache eviction leaves the completed DOM backing untouched; matching identities may still reuse it.
  engine.trimRendererCaches(0);
  adapterSession.modelVersion++;
  const cacheBefore = window.__geulOwnership.counters.identityJobsSkipped;
  const cacheReuse = adapterSession.renderPage(0, canvases[0], 0.5);
  if (!cacheReuse || window.__geulOwnership.counters.identityJobsSkipped !== cacheBefore + 1) throw new Error('cache eviction invalidated or falsely retained page-zero ownership');
  result.cacheEviction = { rendererCaches: JSON.parse(engine.rendererCacheStats()), pageZeroReused: cacheReuse };

  // Create an embedded SVG HWPX fixture so the renderer must wait for an actual browser Image decode.
  const asyncCreator = engine.HwpDocument.createEmpty();
  asyncCreator.createBlankDocument();
  asyncCreator.insertText(0, 0, 0, 'T010 asynchronous image readiness');
  const placed = JSON.parse(asyncCreator.insertPicture(0, 0, 0, '', svg(1200, 1200, 1), 9000, 9000, 1200, 1200, 'svg', '', null, null));
  asyncCreator.setPictureProperties(0, placed.paraIdx, placed.controlIdx, JSON.stringify({ treatAsChar: false,
    horzRelTo: 'Paper', vertRelTo: 'Paper', horzAlign: 'Left', vertAlign: 'Top', horzOffset: 7500, vertOffset: 7500 }));
  const asyncExport = asyncCreator.exportHwpxWithReport();
  const asyncFixture = asyncExport.takeBytes();
  asyncExport.free(); asyncCreator.free();
  result.asyncFixtureSha256 = await sha256(asyncFixture);

  // Hold a real image decode. The frame must remain incomplete until readiness fires.
  const held = [];
  const imageSrc = Object.getOwnPropertyDescriptor(HTMLImageElement.prototype, 'src');
  Object.defineProperty(HTMLImageElement.prototype, 'src', { ...imageSrc, set(value) {
    if (value && !held.length) held.push({ image: this, value });
    else if (value) imageSrc.set.call(this, value);
    else imageSrc.set.call(this, value);
  } });
  delayedImageRestore = () => Object.defineProperty(HTMLImageElement.prototype, 'src', imageSrc);
  const chemicalCanvases = canvases;
  window.__geulOwnership.trim();
  for (const snapshot of [originalSnapshot, editedSnapshot]) if (snapshot != null) documentModel.discardSnapshot(snapshot);
  originalSnapshot = editedSnapshot = null;
  documentModel.free();
  documentModel = loader.openDocument(asyncFixture);
  adapterSession.doc = documentModel;
  adapterSession._pages = readPageSizes(documentModel);
  adapterSession.modelVersion++;
  canvases = [chemicalCanvases[0]];
  const readyPage = 0;
  const completedBeforeAsync = window.__geulOwnership.counters.completed;
  adapterSession.renderPage(readyPage, canvases[readyPage], 0.5);
  const asyncDeadline = performance.now() + 15000;
  while (!held.length && performance.now() < asyncDeadline) await sleep(10);
  if (!held.length) throw new Error('no actual Canvas image readiness callback was held');
  const heldDuring = window.__geulOwnership.counters.completed === completedBeforeAsync
    && window.__geulOwnership.stats().sessions.some(s => s.sessionId === 1 && s.active === 1);
  if (!heldDuring) throw new Error('held async image job was published complete before resource readiness');
  delayedImageRestore(); delayedImageRestore = null;
  imageSrc.set.call(held[0].image, held[0].value);
  await waitForJobs('async-image-readiness', completedBeforeAsync, 1);
  const asyncReference = document.createElement('canvas');
  const asyncExact = frameDifference(0, canvases[0], asyncReference, 0.5);
  asyncReference.width = asyncReference.height = 0;
  if (!asyncExact.exact) throw new Error('async image frame differs from independent Full');
  result.asyncImageReadiness = { fixtureFormat: documentModel.getSourceFormat(), heldImageAssignments: held.length,
    remainedPendingUntilRelease: heldDuring, completedAfterRelease: window.__geulOwnership.counters.completed === completedBeforeAsync + 1,
    exactRGBA: asyncExact };

  // Closing/reopening the same bytes in the same adapter session must not inherit old Canvas proof.
  documentModel.free();
  documentModel = loader.openDocument(new Uint8Array(fixture));
  adapterSession.doc = documentModel;
  adapterSession._pages = readPageSizes(documentModel);
  adapterSession.modelVersion++;
  canvases = chemicalCanvases;
  const reloadBeforeSkipped = window.__geulOwnership.counters.identityJobsSkipped;
  const reload = await renderRevision('same-session-document-reload');
  if (reload.record.identityJobsSkipped !== 0 || window.__geulOwnership.counters.identityJobsSkipped !== reloadBeforeSkipped) throw new Error('document reload reused a prior document frame');

  // A new Canvas and changed scale/environment are full-render paths.
  const replacementWrapper = document.createElement('section'); replacementWrapper.className = 't010-page';
  const replacementCanvas = document.createElement('canvas'); replacementWrapper.append(replacementCanvas); document.querySelector('#pages').append(replacementWrapper);
  const beforeReplacementJobs = window.__geulOwnership.counters.fullJobs;
  const beforeReplacementCompleted = window.__geulOwnership.counters.completed;
  adapterSession.renderPage(0, replacementCanvas, 0.5);
  await waitForJobs('replacement-canvas', beforeReplacementCompleted, 1);
  if (window.__geulOwnership.counters.fullJobs !== beforeReplacementJobs + 1) throw new Error('replacement Canvas did not run Full');
  adapterSession.modelVersion++;
  const beforeScaleJobs = window.__geulOwnership.counters.fullJobs;
  const beforeScaleCompleted = window.__geulOwnership.counters.completed;
  adapterSession.renderPage(0, canvases[0], 0.6);
  await waitForJobs('changed-scale', beforeScaleCompleted, 1);
  if (window.__geulOwnership.counters.fullJobs !== beforeScaleJobs + 1) throw new Error('changed scale reused a prior frame');
  const originalDprDescriptor = Object.getOwnPropertyDescriptor(window, 'devicePixelRatio');
  const currentDpr = devicePixelRatio;
  const environmentBeforeDpr = window.__GEUL_T010_LAST_RENDER_ENV_KEY__;
  const environmentDiagnosticBeforeDpr = window.__GEUL_T010_LAST_RENDER_ENV_DIAGNOSTIC__;
  Object.defineProperty(window, 'devicePixelRatio', { configurable: true, value: currentDpr + 1 });
  const changedDpr = devicePixelRatio;
  const windowDprAfterOverride = window.devicePixelRatio;
  const dprOverrideObservableInThisEngine = navigator.userAgent.includes('Chrome/');
  let changedDprFullJobs = null, dprExact = null;
  if (dprOverrideObservableInThisEngine && changedDpr !== currentDpr && windowDprAfterOverride === changedDpr) {
    const beforeDprJobs = window.__geulOwnership.counters.fullJobs;
    const beforeDprCompleted = window.__geulOwnership.counters.completed;
    const beforeDprSkipped = window.__geulOwnership.counters.identityJobsSkipped;
    adapterSession.modelVersion++;
    const changedDprCompleted = adapterSession.renderPage(0, canvases[0], 0.6);
    const environmentAfterDpr = window.__GEUL_T010_LAST_RENDER_ENV_KEY__;
    const environmentDiagnosticAfterDpr = window.__GEUL_T010_LAST_RENDER_ENV_DIAGNOSTIC__;
    const environmentDpr = key => key ? JSON.parse(key).devicePixelRatio : null;
    result.dprEnvironmentCheck = {
      status:'PASS', nativeDprBefore:currentDpr, overriddenDpr:changedDpr, windowDprAfterOverride,
      dprOverrideObservableInThisEngine,
      environmentDprBefore:environmentDpr(environmentBeforeDpr), environmentDprAfter:environmentDpr(environmentAfterDpr),
      environmentDiagnosticBeforeDpr, environmentDiagnosticAfterDpr,
      environmentKeyChanged:environmentBeforeDpr !== environmentAfterDpr, returnedCompleted:changedDprCompleted,
    };
    if (environmentDpr(environmentAfterDpr) !== changedDpr || environmentBeforeDpr === environmentAfterDpr) {
      throw new Error(`changed DPR was not observed as an environment change: ${JSON.stringify(result.dprEnvironmentCheck)}`);
    }
    await waitForJobs('changed-dpr', beforeDprCompleted, 1);
    changedDprFullJobs = window.__geulOwnership.counters.fullJobs - beforeDprJobs;
    if (changedDprFullJobs !== 1 || window.__geulOwnership.counters.identityJobsSkipped !== beforeDprSkipped) {
      throw new Error('changed device-pixel ratio did not force exactly one Full job');
    }
    const dprReference = document.createElement('canvas');
    dprExact = frameDifference(0, canvases[0], dprReference, 0.6);
    dprReference.width = dprReference.height = 0;
    if (!dprExact.exact) throw new Error('changed device-pixel ratio Full render differed from reference');
  } else {
    result.dprEnvironmentCheck = {
      status:'WINDOW_PROPERTY_OVERRIDE_UNSUPPORTED', nativeDpr:currentDpr,
      topLevelBindingAfterOverride:changedDpr, windowPropertyAfterOverride:windowDprAfterOverride,
      dprOverrideObservableInThisEngine,
      reason:'This browser did not expose a same-world Window.devicePixelRatio change; no environment change was simulated.',
    };
  }
  if (originalDprDescriptor) Object.defineProperty(window, 'devicePixelRatio', originalDprDescriptor);
  else delete window.devicePixelRatio;
  result.invalidation = { replacementCanvasFullJobs: 1, changedScaleFullJobs: 1, changedDprFullJobs, changedDprExactRGBA: dprExact };

  result.lifecycle = trace.snapshot({ terminal: true });
  if (result.lifecycle.lifecycleValid !== 'VALID' || !result.lifecycle.captureComplete) throw new Error(`adapter lifecycle trace invalid: ${result.lifecycle.lifecycleValid}`);
  result.adapterCounters = { ...window.__geulOwnership.counters };
  result.asyncPolls = trace.snapshot().records.filter(r => r.event === 'poll' && r.state === 'PENDING').length;
  result.fullReferenceMs = percentile(result.revisions.flatMap(r => r.exactRGBA.mismatches.length ? [] : [r.fullReferenceRenderMs.p50]));
  if (undo.record.identityJobsSkipped !== result.undoIdentityComparison.matchingCurrentFrames.length
      || redo.record.identityJobsSkipped !== result.redoIdentityComparison.matchingCurrentFrames.length) {
    throw new Error('Undo/Redo reuse did not match the exact restored page identities');
  }
  result.status = 'PASS';
}

let canvases = [];
try {
  await run();
} catch (error) {
  result.status = 'FAIL';
  result.error = String(error);
  if (window.__geulOwnership) result.adapterCounters = { ...window.__geulOwnership.counters };
  if (trace) result.lifecycle = trace.snapshot({ terminal: !!adapterSession });
} finally {
  delayedImageRestore?.();
  try { if (originalSnapshot != null) documentModel?.discardSnapshot(originalSnapshot); } catch {}
  try { if (editedSnapshot != null) documentModel?.discardSnapshot(editedSnapshot); } catch {}
  try { adapterSession?.dispose(); } catch (error) { result.cleanupError = String(error); }
  try { engine?.trimRendererCaches(0); } catch (error) { result.cacheCleanupError = String(error); }
  if (window.__geulOwnership) {
    const stats = window.__geulOwnership.stats();
    result.cleanup = { subscribers: stats.subscribers, jobs: stats.jobs, cache: stats.cache };
    if (stats.subscribers !== 0 || stats.jobs.pendingCount !== 0 || stats.jobs.activeLeaseCount !== 0 || stats.jobs.uniqueResourceCount !== 0) result.status = 'FAIL';
  }
  result.finishedAt = new Date().toISOString();
  out.textContent = JSON.stringify(result);
  window.__T010_PAGE_REUSE_RESULT__ = result;
}
</script>
