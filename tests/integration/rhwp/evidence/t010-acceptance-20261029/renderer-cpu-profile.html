<script type="module">
// Chrome sampler용 원본 엔진 진단. 공식 D4 입력 지연 측정이 아니다.
const manifest=await(await fetch('/__ownership_candidate__/ENGINE.json')).json();
const candidateURL='/__ownership_candidate__/rhwp.js';
const mod=await import(/* @vite-ignore */ candidateURL);
await mod.default({module_or_path:'/__ownership_candidate__/rhwp_bg.wasm'});
const fixtureIdentities={};
const load=async (url,expected)=>{
 const bytes=new Uint8Array(await(await fetch(url)).arrayBuffer());
 const sha=[...new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))].map(b=>b.toString(16).padStart(2,'0')).join('');
 if(sha!==expected)throw new Error('fixture identity mismatch');
 fixtureIdentities[url]=sha;return new mod.HwpDocument(bytes);
};
const asset=await load('/external/rhwp/samples/issue6031/3249937_asset_management_rules.hwpx','97b5d6c571a6b7626321c6a53d797e3511978447497bb73309bd23eaa8e7ea77');
const chemical=await load('/complex-hwp.hwp','6717eca43c6fdd9b0530530cf17d33b6687da0c462a433d37eb652afb5394f91');
const canvas=document.createElement('canvas');
for(let n=0;n<4;n++)asset.renderPageToCanvas(0,canvas,.5);
await document.fonts.ready;
window.__t010ProfileRun=async mode=>{
 const times=[];
 for(let n=0;n<(mode==='asset-warm'?32:6);n++){
  if(mode==='chemical-cold')mod.trimRendererCaches(0);
  const start=performance.now();
  (mode==='asset-warm'?asset:chemical).renderPageToCanvas(mode==='asset-warm'?0:20,canvas,.5);
  times.push(performance.now()-start);
  await new Promise(r=>setTimeout(r,0));
 }
 return {mode,iterations:times.length,renderMs:times,candidateWasmSha256:manifest.artifacts['rhwp_bg.wasm'],candidateSourceSha256:manifest.sourceTreeSha256,fixtureIdentities,official:false};
};

window.__t010ProfileReady=true;
</script>
