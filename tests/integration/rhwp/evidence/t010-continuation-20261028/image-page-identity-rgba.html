<!doctype html><meta charset="utf-8"><pre id="out">RUNNING</pre><script type="module">
const out=document.querySelector('#out'),sleep=ms=>new Promise(r=>setTimeout(r,ms));let doc,mod;
async function full(page){
 const canvas=document.createElement('canvas');let id;
 try{
  id=doc.beginRenderJob(page,canvas,.5);let state='PENDING';
  for(let i=0;i<1500&&state==='PENDING';i++){state=doc.pollRenderJob(id);if(state==='PENDING')await sleep(10);}
  if(state!=='COMPLETE')throw new Error(`page ${page} job ${state}`);
  const {width,height}=canvas;const pixels=canvas.getContext('2d').getImageData(0,0,width,height).data;
  return {width,height,pixels};
 }finally{if(id!==undefined)doc.cancelRenderJob(id);canvas.width=0;canvas.height=0;}
}
try{
 mod=await import('/candidate/rhwp.js');await mod.default({module_or_path:'/candidate/rhwp_bg.wasm'});mod.setRendererPreparationEnabled(true);
 doc=new mod.HwpDocument(new Uint8Array(await(await fetch('/sample.hwp')).arrayBuffer()));
 const before=Array.from({length:doc.pageCount()},(_,i)=>doc.geulExperimentalImagePageIdentity(i));const frames=new Map();
 for(let i=0;i<before.length;i++)if(before[i]!=null)frames.set(i,await full(i));
 const length=doc.getParagraphLength(0,3),edit=JSON.parse(doc.insertText(0,3,0,'a'));
 if(doc.getParagraphLength(0,3)!==length+1||edit.charOffset!==1)throw new Error('edit was not confirmed');
 const after=Array.from({length:doc.pageCount()},(_,i)=>doc.geulExperimentalImagePageIdentity(i));const comparisons=[];
 for(let i=0;i<before.length;i++)if(before[i]!=null&&before[i]===after[i]){
  const a=frames.get(i),b=await full(i);let differences=0;
  if(a.width!==b.width||a.height!==b.height)throw new Error(`page ${i} extent mismatch`);
  for(let j=0;j<a.pixels.length;j++)if(a.pixels[j]!==b.pixels[j])differences++;
  comparisons.push({page:i,width:a.width,height:a.height,channelDifferences:differences});
 }
 if(!comparisons.length||comparisons.some(r=>r.channelDifferences!==0))throw new Error('full-frame comparison failed');
 out.textContent=JSON.stringify({status:'DIAGNOSTIC_COMPLETE',editConfirmed:true,baselineFullFrames:frames.size,comparisons,
  scope:'independent full jobs before/after edit, Chrome scale 0.5, same-index matching digest; not reuse, WebKit or D4 proof'});
}catch(e){out.textContent=JSON.stringify({status:'FAIL',error:String(e)});}finally{doc?.free();mod?.trimRendererCaches(0);}
</script>
