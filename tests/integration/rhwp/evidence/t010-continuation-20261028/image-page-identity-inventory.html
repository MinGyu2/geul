<!doctype html><meta charset="utf-8"><pre id="out">RUNNING</pre><script type="module">
const out=document.querySelector('#out');let doc;
try {
 const mod=await import('/candidate/rhwp.js');await mod.default({module_or_path:'/candidate/rhwp_bg.wasm'});
 const bytes=new Uint8Array(await(await fetch('/sample.hwp')).arrayBuffer());doc=new mod.HwpDocument(bytes);
 const collect=()=>{const rows=[];for(let page=0;page<doc.pageCount();page++){const t=performance.now();const id=doc.geulExperimentalImagePageIdentity(page);rows.push({id,ms:performance.now()-t});}return rows;};
 const first=collect(), second=collect(), before=first.map(r=>r.id), repeat=second.map(r=>r.id);
 const lengthBefore=doc.getParagraphLength(0,3);const edit=JSON.parse(doc.insertText(0,3,0,'a'));const lengthAfter=doc.getParagraphLength(0,3);
 if(lengthAfter!==lengthBefore+1||edit.charOffset!==1)throw new Error('edit was not confirmed');
 const third=collect(), after=third.map(r=>r.id);
 out.textContent=JSON.stringify({status:'DIAGNOSTIC_COMPLETE',pagesBefore:before.length,pagesAfter:after.length,
  supportedBefore:before.flatMap((id,i)=>id===undefined||id===null?[]:[i]),
  supportedAfter:after.flatMap((id,i)=>id===undefined||id===null?[]:[i]),
  repeatStable:before.every((id,i)=>id===repeat[i]),
  sameIndexEqual:before.flatMap((id,i)=>id!=null&&id===after[i]?[i]:[]),
  milliseconds:{first:first.map(r=>r.ms),repeat:second.map(r=>r.ms),afterEdit:third.map(r=>r.ms)},
  editConfirmed:{lengthDelta:lengthAfter-lengthBefore,charOffset:edit.charOffset},scope:'digest availability and equality only; not render identity proof, RGBA or performance'});
}catch(e){out.textContent=JSON.stringify({status:'FAIL',error:String(e)});}finally{doc?.free();}
</script>
